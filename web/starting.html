<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crease IQ · starting</title>
<!-- Opened by the desktop launcher straight away (as a file, before the app is up). It checks every half second
     whether the app answers on port 8000 and then switches to it. -->
<style>
  :root { --bg: #f4f6f3; --card: #ffffff; --ink: #14201a; --muted: #5d6b63; --accent: #1f8a5b; --line: #dfe5e0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1411; --card: #152019; --ink: #e8efe9; --muted: #93a39a; --accent: #3fcf8e; --line: #24332a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Segoe UI", system-ui, sans-serif; padding: 16px; }
  .card { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px;
          padding: 32px 28px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -.01em; }
  h1 b { color: var(--accent); }
  p { margin: 6px 0 0; color: var(--muted); }
  .ball { width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e0553f, #a3261a);
          position: relative; animation: spin 1.1s linear infinite; }
  .ball::after { content: ""; position: absolute; inset: 20px 0; border-top: 2px dashed rgba(255,255,255,.75); border-bottom: 2px dashed rgba(255,255,255,.75); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ball { animation: none; } }
  #secs { font-variant-numeric: tabular-nums; }
  #slow { display: none; margin-top: 14px; font-size: .9rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="ball" aria-hidden="true"></div>
    <h1>Crease <b>IQ</b> is starting…</h1>
    <p>Loading the models. This page opens the app by itself <span id="secs"></span></p>
    <p id="slow">Taking longer than usual. The first start after switching the computer on can take up to a minute.
      If nothing happens, look at the black “Cricket Win Predictor” window for an error, or
      <a href="http://127.0.0.1:8000/#home">try opening the app</a>.</p>
  </main>
<script>
  const APP = "http://127.0.0.1:8000/";
  const start = Date.now();
  function check() {
    const img = new Image();  // an image works from a file page without any browser security prompt
    img.onload = () => location.replace(APP + "#home");
    img.onerror = () => setTimeout(check, 500);
    img.src = APP + "static/img/theme/hero.jpg?t=" + Date.now();
  }
  setInterval(() => {
    const s = Math.round((Date.now() - start) / 1000);
    document.getElementById("secs").textContent = s ? `(${s}s)` : "";
    if (s >= 45) document.getElementById("slow").style.display = "block";
  }, 1000);
  check();
</script>
</body>
</html>
